name: Check connector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install licensed UI components
        if: env.HEROUI_AUTH_TOKEN != ''
        run: npx heroui-pro@latest install react --yes --skip-peers
      - name: Download Electron runtime
        if: env.HEROUI_AUTH_TOKEN != ''
        run: npm rebuild electron
      - run: npm run build:dir
        if: env.HEROUI_AUTH_TOKEN != ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
