    <path stroke="#a5e1bd" d="M46 84L84 46M58 46H84V72"/>
  </g></g>
    <text x="164" y="141" fill="#e6edf3" font-size="74" font-weight="600" letter-spacing="-4">Bring AI<tspan fill="#a5e1bd">_</tspan></text>
    <text x="64" y="218" fill="#e6edf3" font-size="32" letter-spacing="-1">Local inference bridge for web apps.</text>
    <text x="64" y="255" fill="#8b949e" font-size="18">Connect an account. Approve an origin. Request inference.</text>
    
    <rect x="64" y="310" width="304" height="90" rx="2" fill="#111820" stroke="#30363d"/>
    <text x="86" y="346" fill="#e6edf3" font-size="22">web app</text>
    <text x="86" y="376" fill="#8b949e" font-size="16">prompt + context</text>
    
    <rect x="488" y="310" width="304" height="90" rx="2" fill="#111820" stroke="#a5e1bd"/>
    <text x="510" y="346" fill="#a5e1bd" font-size="22">127.0.0.1:4360</text>
    <text x="510" y="376" fill="#8b949e" font-size="16">permissioned connector</text>
    
    <rect x="912" y="310" width="304" height="90" rx="2" fill="#111820" stroke="#30363d"/>
    <text x="934" y="346" fill="#e6edf3" font-size="22">AI provider</text>
    <text x="934" y="376" fill="#8b949e" font-size="16">your connected account</text>
    <g fill="none" stroke="#8b949e" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M390 355H466"/><path d="M814 355H890"/></g>
    <text x="64" y="448" fill="#8b949e" font-size="16">Credentials stay on your computer. App tools stay on the server.</text>
    <path d="M1202 438H1216V424M50 424V438H64" fill="none" stroke="#30363d"/>
  </g></svg></svg>
