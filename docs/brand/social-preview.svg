  </defs>
  <rect width="1280" height="480" fill="#0d1117"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="479" fill="none" stroke="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="38" fill="#8b949e" font-size="13" letter-spacing="1.7">DESKTOP CONNECTOR / BROWSER SDK</text>
    <text x="1216" y="38" text-anchor="end" fill="#8b949e" font-size="13" letter-spacing="1.4">OPEN SOURCE · ALPHA</text>
    <g transform="translate(54 66) scale(.76)"><g fill="none" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
