<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description"><title id="title">Bring AI — local inference bridge for web apps</title><desc id="description">Open-source desktop connector and browser SDK with per-origin approval.</desc><rect width="1200" height="630" fill="#0d1117"/><svg x="0" y="90" width="1200" height="450" viewBox="0 0 1280 480"><defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b232d" stroke-width="0.6"/></pattern>
